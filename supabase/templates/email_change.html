<!doctype html>
<html lang="en">
  <body style="margin:0;padding:32px 16px;background:#faf6ee;font-family:Helvetica,Arial,sans-serif;color:#35291a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#fffdf8;border:1px solid #e6d9bf;border-radius:12px;">
      <tr><td style="padding:28px 28px 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8a7a5f;">{{ .SiteURL }}</td></tr>
      <tr><td style="padding:0 28px;font-size:22px;font-weight:600;">Confirm your new email</td></tr>
      <tr><td style="padding:12px 28px 0;font-size:15px;line-height:1.55;">
        You asked to move your account from {{ .Email }} to {{ .NewEmail }}. Tap the button to confirm the change.
      </td></tr>
      <tr><td style="padding:24px 28px;">
        <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=email_change" style="display:inline-block;padding:12px 22px;border-radius:8px;background:#b3641b;color:#ffffff;text-decoration:none;font-weight:600;">Confirm new email</a>
      </td></tr>
      <tr><td style="padding:0 28px 28px;font-size:13px;line-height:1.5;color:#8a7a5f;">
        If this was not you, ignore it and nothing changes.
      </td></tr>
    </table>
  </body>
</html>
